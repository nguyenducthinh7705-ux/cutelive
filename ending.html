<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết thúc live</title>
<link rel="stylesheet" href="assets/cute.css">
<style>
  .next-txt { font: 800 110px/1 var(--fd); color: var(--p); overflow-wrap: anywhere; }
  .panel .lbl b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div class="viewport"><div class="stage scene">
  <div class="field"><div class="band"></div></div>
  <div class="topbar">
    <span class="logo" data-game></span>
    <span class="tag ink"><span>Hết live</span></span>
  </div>
  <div class="portrait"><div class="art" data-art="portrait"></div></div>
  <div class="copy">
    <h1 class="title">Cảm ơn cả nhà</h1>
    <div class="sub">Hôm nay vui lắm luôn á. Ngủ ngon nha mọi người.</div>
    <div class="lift"><div class="plate panel">
      <span class="lbl">Live tiếp theo</span>
      <span class="next-txt" data-bind="next"></span>
      <span class="lbl">Follow <b data-bind="handle"></b> để được báo khi lên sóng</span>
    </div></div>
  </div>
  <div class="foot">
    <span class="tipline"><span>Mai gặp lại nha</span></span>
    <span class="tag ink"><span data-bind="handle"></span></span>
  </div>
</div></div>
<script src="assets/cute.js"></script>
<script>CL.init();</script>
</body>
</html>
