<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Live Kit</title>
<link rel="stylesheet" href="assets/cute.css">
<style>
  /* Bảng điều khiển dùng cùng ngôn ngữ HUD: khối góc vuông, sọc màu, nút nghiêng. */
  html, body { height: auto !important; min-height: 100%; overflow: auto !important; }
  body.hub { background: var(--bone); font-size: 15px; }
  .hub-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; max-width: 1520px; margin: 0 auto; padding: 28px 28px 20px; border-bottom: 2px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; }
  .brand h1 { margin: 0; font: 800 46px/1 var(--fd); }
  .brand p { margin: 4px 0 0; color: var(--mute); }
  .hub-main { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 28px; align-items: start; max-width: 1520px; margin: 0 auto; padding: 24px 28px 56px; }
  .side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow: auto; padding-right: 6px; }
  .sec { position: relative; background: #fff; padding: 18px 18px 18px; border-top: 4px solid var(--p); }
  .sec h2 { margin: 0 0 10px; font: 800 26px/1 var(--fd); }
  .f { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--mute); }
  .f output { font-weight: 500; }
  .f input:not([type=range]):not([type=color]), .f select, .f textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0; outline: none;
    background: var(--bone); color: var(--ink); font: 500 15px var(--fb);
  }
  .f textarea { min-height: 96px; resize: vertical; }
  .f input:focus, .f select:focus, .f textarea:focus { border-color: var(--p); box-shadow: inset 0 -3px 0 var(--p); }
  .f input[type=range] { accent-color: var(--p); }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--mute); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .gtile { position: relative; display: grid; place-items: center; height: 62px; padding: 10px 14px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .gtile img { max-width: 100%; max-height: 32px; }
  .gtile .gt { font: 800 20px/1 var(--fd); color: var(--ink); }
  .gtile.on { border-color: var(--ink); box-shadow: inset 0 -5px 0 var(--c); }
  .chars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-height: 260px; overflow: auto; margin-top: 10px; }
  .ctile { display: block; aspect-ratio: 1; padding: 0; border: 2px solid transparent; background: var(--p2); cursor: pointer; overflow: hidden; }
  .ctile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ctile.on { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--p); }
  .ctile:focus-visible { outline: 3px solid var(--p); outline-offset: 1px; }
  [hidden] { display: none !important; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); }
  .seg button { padding: 10px; border: 0; background: #fff; color: var(--ink); font: 600 14px var(--fb); cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--bone); }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 500; font-size: 14px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--p); }
  .btn { display: inline-block; transform: skewX(-12deg); padding: 10px 18px; border: 0; background: var(--ink); color: var(--bone); cursor: pointer; }
  .btn > span { display: inline-flex; align-items: center; gap: 8px; transform: skewX(12deg); font: 800 19px/1 var(--fd); white-space: nowrap; }
  .btn.pri { background: var(--p); color: #fff; }
  .btn.soft { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .btn img { width: 20px; height: 20px; }
  .btn:focus-visible, .gtile:focus-visible, .mtile:focus-visible, .seg button:focus-visible { outline: 3px solid var(--p); outline-offset: 2px; }
  .btn:active { transform: skewX(-12deg) translateY(1px); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .colorrow { display: flex; align-items: center; gap: 10px; }
  .colorrow input[type=color] { width: 46px; height: 36px; padding: 2px; border: 1px solid var(--line); background: #fff; cursor: pointer; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; padding: 14px 16px; background: #fff; }
  .toolbar .lbl { font: 800 24px/1 var(--fd); margin-right: 6px; }
  .toolbar .sp { flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
  .cards.h { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .sc { display: flex; flex-direction: column; gap: 10px; }
  .screen { position: relative; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .cards.h .screen { aspect-ratio: 16 / 9; }
  .screen.game { background: linear-gradient(160deg, #5b6b7d, #20252e); }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .sc h3 { margin: 4px 0 0; font: 800 26px/1 var(--fd); }
  .sc p { margin: 4px 0 0; font-size: 13px; color: var(--mute); }
  .sc .meta { font-size: 12px; color: var(--mute); }
  .acts { display: flex; gap: 10px; }

  .guide { margin-top: 28px; padding: 18px 20px; background: #fff; border-top: 4px solid var(--ink); }
  .guide summary { cursor: pointer; font: 800 26px/1 var(--fd); }
  .guide ol { margin: 14px 0 0; padding-left: 22px; line-height: 1.65; max-width: 80ch; }
  .guide li { margin-bottom: 8px; }
  .guide code { padding: 1px 6px; background: var(--bone); font-size: 13px; }
  .credit { margin: 18px 0 0; font-size: 12px; color: var(--mute); line-height: 1.6; max-width: 80ch; }
  .credit a { color: inherit; }

  @media (max-width: 900px) {
    .hub-main { grid-template-columns: 1fr; padding: 20px 16px 40px; }
    .hub-head { padding: 20px 16px 16px; }
    .side { position: static; max-height: none; overflow: visible; }
  }
  .head-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .seg.langs { grid-template-columns: repeat(3, auto); }
  .langs button { padding: 8px 12px; font-size: 13px; }
  :lang(zh) .brand h1, :lang(zh) .sec h2 { letter-spacing: 0; }
</style></head>
<body class="hub">
<header class="hub-head">
  <div class="brand">
    <div>
      <h1>Cute Live Kit</h1>
      <p data-i="tagline"></p>
    </div>
  </div>
  <div class="head-acts">
    <div class="seg langs" id="uilang" aria-label="Language"><button data-v="vi">Tiếng Việt</button><button data-v="en">English</button><button data-v="zh">中文</button></div>
    <button class="btn soft" id="copyDock"><span data-i="copyDock"></span></button>
  </div>
</header>

<div class="hub-main">
  <aside class="side">
    <section class="sec">
      <h2 data-i="game"></h2>
      <div class="games" id="games"></div>
      <label class="f"><span data-i="gamename"></span><input id="gamename" data-ip="gamenamePh"></label>
    </section>

    <section class="sec">
      <h2 data-i="character"></h2>
      <p class="hint" id="charhint"></p>
      <label class="f" id="charqWrap"><span data-i="searchChamp"></span><input id="charq" data-ip="searchPh"></label>
      <div class="chars" id="chars"></div>
    </section>

    <section class="sec">
      <h2 data-i="channel"></h2>
      <label class="f"><span data-i="overlayLang"></span><select id="lang"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh">中文</option></select></label>
      <label class="f"><span data-i="name"></span><input id="name" maxlength="28"></label>
      <label class="f"><span data-i="handle"></span><input id="handle" maxlength="30"></label>
      <label class="f"><span data-i="rank"></span><input id="rank" data-ip="rankPh"></label>
      <label class="f"><span data-i="intro"></span><input id="msg" data-ip="introPh"></label>
    </section>

    <section class="sec">
      <h2 data-i="layout"></h2>
      <div class="seg" id="layout"><button data-v="v" data-i="vertical"></button><button data-v="h" data-i="horizontal"></button></div>
      <div class="two">
        <label class="f"><span data-i="camFrame"></span><select id="cam"><option value="tr" data-i="camRight"></option><option value="tl" data-i="camLeft"></option><option value="off" data-i="camHide"></option></select></label>
        <label class="f"><span data-i="camRatio"></span><select id="camshape"><option value="sq" data-i="square"></option><option value="43">4:3</option><option value="169">16:9</option></select></label>
      </div>
      <label class="f"><span><span data-i="camSize"></span> <output id="camsizeOut"></output></span><input type="range" id="camsize" min="240" max="620" step="10"></label>
      <label class="chk"><input type="checkbox" id="ticker"> <span data-i="showTicker"></span></label>
    </section>

    <section class="sec">
      <h2 data-i="countdown"></h2>
      <div class="two">
        <label class="f"><span data-i="minutes"></span><input id="min" type="number" min="0" step="1"></label>
        <label class="f"><span data-i="orTime"></span><input id="at" type="time"></label>
      </div>
      <p class="hint" data-i="countdownHint"></p>
    </section>

    <section class="sec">
      <h2 data-i="goalSec"></h2>
      <div class="two">
        <label class="f"><span data-i="current"></span><input id="cur" type="number" min="0"></label>
        <label class="f"><span data-i="target"></span><input id="goal" type="number" min="1"></label>
      </div>
      <div class="steps"><button class="btn soft" data-step="-1"><span>−1</span></button><button class="btn" data-step="1"><span>+1</span></button><button class="btn" data-step="10"><span>+10</span></button></div>
    </section>

    <section class="sec">
      <h2 data-i="messages"></h2>
      <label class="f"><span data-i="tickerLines"></span><textarea id="msgs"></textarea></label>
      <p class="hint" data-ih="tickerHint"></p>
      <label class="f"><span data-i="nextLive"></span><input id="next"></label>
    </section>

    <section class="sec">
      <h2 data-i="colorSound"></h2>
      <div class="colorrow"><input type="color" id="color"><span style="flex:1;font-size:14px" data-i="mainColor"></span><button class="btn soft" id="colorReset"><span data-i="byGame"></span></button></div>
      <label class="chk"><input type="checkbox" id="sound"> <span data-i="alertSound"></span></label>
      <label class="chk"><input type="checkbox" id="ws"> <span data-i="tikfinity"></span></label>
      <p class="hint" id="wsStatus" hidden></p>
    </section>
  </aside>

  <main>
    <div class="toolbar">
      <span class="lbl" data-i="testAlert"></span>
      <button class="btn pri" data-alert="follow"><span data-i="aFollow"></span></button>
      <button class="btn pri" data-alert="gift"><span data-i="aGift"></span></button>
      <button class="btn pri" data-alert="like"><span data-i="aLike"></span></button>
      <button class="btn pri" data-alert="share"><span data-i="aShare"></span></button>
      <button class="btn pri" data-alert="sub"><span data-i="aSub"></span></button>
      <span class="sp"></span>
      <label class="chk" style="margin:0"><input type="checkbox" id="guides"> <span data-i="showZones"></span></label>
    </div>
    <div class="cards" id="cards"></div>

    <details class="guide" id="guide">
      <summary data-i="guideTitle"></summary>
      <ol id="guideList"></ol>
    </details>
    <p class="credit"><span data-ih="credit"></span><br>Cute Live Kit isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc.</p>
  </main>
</div>

<script src="assets/cute.js"></script>

        '每个等待画面（即将开播、马上回来、直播结束）各建一个场景。游戏场景从下到上：游戏、摄像头、游戏叠加层、提醒。把摄像头对准四个角框。',

        '<b>跟随真实直播的提醒和关注目标：</b>打开 TikFinity，连接直播并开启 Event API。<b>从电脑上的文件</b>打开控制面板（CuteLiveKit 文件夹里的 <code>index.html</code>），勾选 TikFinity，等出现“已连接 TikFinity”，再复制提醒和游戏叠加层的链接。关闭 TikFinity 自带的提醒，避免重复。',
        '<b>拆分显示：</b>在游戏叠加层链接末尾加上 <code>&amp;only=cam</code>、<code>&amp;only=info</code> 或 <code>&amp;only=ticker</code>，只显示其中一部分。'
      ]
    }
  };
  const DD_LOCALE = { vi: 'vi_VN', en: 'en_US', zh: 'zh_CN' };

  const $ = s => document.querySelector(s);
  const SCENES = [
    { f: 'starting.html', t: 'sStart', d: 'dStart', solid: true },
    { f: 'ingame.html', t: 'sIngame', d: 'dIngame' },
    { f: 'alerts.html', t: 'sAlert', d: 'dAlert' },
    { f: 'brb.html', t: 'sBrb', d: 'dBrb', solid: true },
    { f: 'ending.html', t: 'sEnd', d: 'dEnd', solid: true },
    { f: 'cover.html', t: 'sCover', d: 'dCover', solid: true }
  ];
  const TIKFINITY = 'ws://localhost:21213/';
  const NAMES = ['Mochi', 'Bánh Bao', 'Lily', 'Momo', '小雪', '糖糖'];
  const GIFTS = ['Rose', 'Galaxy', 'Corgi'];
  let cfg = CL.readCfg();
  let hub = {};
  try { hub = JSON.parse(localStorage.getItem('cuteLive.hub') || '{}') || {}; } catch (e) { /* bỏ qua */ }
  if (!UI[hub.ui]) { const nl = (navigator.language || '').toLowerCase(); hub.ui = nl.startsWith('zh') ? 'zh' : nl.startsWith('vi') ? 'vi' : 'en'; }
  const L = key => (UI[hub.ui][key] != null ? UI[hub.ui][key] : UI.vi[key]);
  const saveHub = () => { try { localStorage.setItem('cuteLive.hub', JSON.stringify(hub)); } catch (e) { /* bỏ qua */ } };
  const frames = [];
  let wsOk = false;

  // Đổi chữ giao diện theo ngôn ngữ đang chọn
  function applyUI() {
    document.documentElement.lang = hub.ui === 'zh' ? 'zh-CN' : hub.ui;
    document.querySelectorAll('[data-i]').forEach(el => { el.textContent = L(el.dataset.i); });
    document.querySelectorAll('[data-ih]').forEach(el => { el.innerHTML = L(el.dataset.ih); });
    document.querySelectorAll('[data-ip]').forEach(el => { el.placeholder = L(el.dataset.ip); });
    $('#guideList').innerHTML = L('guide').map(s => `<li>${s}</li>`).join('');
    document.querySelectorAll('#uilang button').forEach(b => b.classList.toggle('on', b.dataset.v === hub.ui));
    document.querySelectorAll('.sc').forEach(el => {
      const s = SCENES[+el.dataset.scene];
      el.querySelector('h3').textContent = L(s.t);
      el.querySelector('.desc').textContent = L(s.d);
      el.querySelector('.bg-kind').textContent = L(s.solid ? 'solid' : 'transparent');
      el.querySelector('.copy span').textContent = L('copyLink');
      el.querySelector('.open span').textContent = L('open');
    });
    const chat = document.querySelector('.gtile[data-game=chill] .gt');
    if (chat) chat.textContent = { vi: 'Trò chuyện', en: 'Just Chatting', zh: '聊天' }[hub.ui];
    showWs();
    champs = null;
    renderChars();
  }
  document.querySelectorAll('#uilang button').forEach(b => { b.onclick = () => { hub.ui = b.dataset.v; saveHub(); applyUI(); }; });

  Object.entries(CL.THEMES).forEach(([id, t]) => {
    const b = document.createElement('button');
    b.className = 'gtile'; b.dataset.game = id; b.title = t.short; b.style.setProperty('--c', t.p);
    b.innerHTML = t.logo
      ? `<img src="${CL.LOGO + t.logo}" alt="${t.short}" onerror="this.outerHTML='<span class=gt>${t.short}</span>'">`
      : `<span class="gt">${t.short}</span>`;
    b.onclick = () => { cfg.game = id; changed(); };
    $('#games').appendChild(b);
  });

  // Chọn nhân vật: agent Valorant hoặc tướng LMHT/ĐTCL; game khác dùng logo
  let champs = null, charGame = null;
  function loadChamps() {
    const get = (v, loc) => fetch(`${CL.DD}${v}/data/${loc}/champion.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const loc = DD_LOCALE[hub.ui];
    return CL.loadLolVer()
      .then(v => get(v, loc).catch(() => get(v, 'en_US')))
      .then(d => { champs = Object.values(d.data).map(c => [c.name, c.id]).sort((a, b) => a[0].localeCompare(b[0], hub.ui)); });
  }
  function renderChars() {
    const box = $('#chars'), g = cfg.game;
    charGame = g;
    $('#charqWrap').hidden = !(g === 'lol' || g === 'tft');
    if (g === 'valorant') {
      $('#charhint').textContent = L('hintValo');
      box.innerHTML = CL.VALO_AGENTS.map(([n, id]) => `<button class="ctile" data-char="${id}" title="${n}"><img src="${CL.VALO + id}/displayicon.png" alt="${n}"></button>`).join('');
    } else if (g === 'lol' || g === 'tft') {
      $('#charhint').textContent = L('hintLol');
      if (!champs) {
        box.innerHTML = `<p class="hint">${L('loadingChamps')}</p>`;
        loadChamps().then(() => { if (charGame === g) renderChars(); })
          .catch(() => { box.innerHTML = `<p class="hint">${L('loadFail')}</p>`; });
        return;
      }
      const term = $('#charq').value.trim().toLowerCase();
      box.innerHTML = champs.filter(([n, id]) => !term || n.toLowerCase().includes(term) || id.toLowerCase().includes(term))
        .map(([n, id]) => `<button class="ctile" data-char="${id}" title="${CL.esc(n)}"><img src="${CL.DD + CL.lolVer()}/img/champion/${id}.png" alt="${CL.esc(n)}"></button>`).join('');
    } else {
      $('#charhint').textContent = L('hintNone');
      box.innerHTML = '';
    }
    markChars();
  }
  function markChars() {
    const art = CL.charArt(cfg);
    document.querySelectorAll('.ctile').forEach(b => b.classList.toggle('on', !!art && art.icon.indexOf('/' + b.dataset.char + (cfg.game === 'valorant' ? '/' : '.')) !== -1));
  }
  $('#chars').addEventListener('click', e => { const b = e.target.closest('.ctile'); if (b) { cfg.char = b.dataset.char; changed(); } });
  $('#charq').addEventListener('input', renderChars);

  ['lang', 'gamename', 'name', 'handle', 'rank', 'msg', 'cam', 'camshape', 'camsize', 'min', 'at', 'cur', 'goal', 'next'].forEach(k => {
    const el = document.getElementById(k);
    el.value = cfg[k];
    el.addEventListener('input', () => { cfg[k] = k === 'handle' ? el.value.replace(/^@+/, '') : el.value; changed(); });
  });
  $('#msgs').value = cfg.msgs.split('|').filter(Boolean).join('\n');
  $('#msgs').addEventListener('input', e => {
    cfg.msgs = e.target.value.split('\n').map(s => s.trim().replace(/\|/g, '/')).filter(Boolean).join('|');
    changed();
  });
  ['ticker', 'sound'].forEach(k => {
    const el = document.getElementById(k);
    el.checked = cfg[k] !== '0';
    el.addEventListener('change', () => { cfg[k] = el.checked ? '1' : '0'; changed(); });
  });
  $('#ws').checked = !!cfg.ws;
  $('#ws').addEventListener('change', e => { cfg.ws = e.target.checked ? TIKFINITY : ''; changed(); });
  $('#color').addEventListener('input', e => { cfg.color = e.target.value; changed(); });
  $('#colorReset').onclick = () => { cfg.color = ''; changed(); };
  document.querySelectorAll('#layout button').forEach(b => { b.onclick = () => { cfg.layout = b.dataset.v; changed(); }; });
  document.querySelectorAll('[data-step]').forEach(b => {
    b.onclick = () => { cfg.cur = String(Math.max(0, (parseInt(cfg.cur, 10) || 0) + +b.dataset.step)); $('#cur').value = cfg.cur; changed(); };
  });

  function urlFor(s, preview) {
    const p = new URLSearchParams();
    Object.keys(CL.DEFAULTS).forEach(k => p.set(k, cfg[k] == null ? '' : cfg[k]));
    if (preview) {
      p.set('preview', '1');
      if (s.f === 'alerts.html') { p.set('demo', '1'); p.set('mute', '1'); }
      if (hub.guides) p.set('guides', '1');
    }
    return new URL(s.f, location.href).href.split('?')[0] + '?' + p.toString();
  }

  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    const label = btn.querySelector('span') || btn;
    const old = label.textContent;
    label.textContent = L('copied');
    setTimeout(() => { label.textContent = old; }, 1500);
  }

  SCENES.forEach((s, i) => {
    const el = document.createElement('article');
    el.className = 'sc'; el.dataset.scene = i;
    el.innerHTML = `<div class="screen ${s.solid ? '' : 'game'}"><iframe title="${s.f}"></iframe></div>` +
      '<div><h3></h3><p class="desc"></p><p class="meta"><span class="sz"></span>, <span class="bg-kind"></span></p></div>' +
      '<div class="acts"><button class="btn pri copy"><span></span></button><button class="btn soft open"><span></span></button></div>';
    const fr = el.querySelector('iframe');
    fr.src = urlFor(s, true);
    frames.push(fr);
    el.querySelector('.copy').onclick = e => copy(urlFor(s, false), e.currentTarget);
    el.querySelector('.open').onclick = () => window.open(urlFor(s, false), '_blank');
    $('#cards').appendChild(el);
  });

  $('#copyDock').onclick = e => copy(location.href.split('?')[0].split('#')[0], e.currentTarget);
  $('#guides').checked = !!hub.guides;
  $('#guides').addEventListener('change', e => {
    hub.guides = e.target.checked;
    saveHub();
    frames.forEach(f => f.contentWindow && f.contentWindow.postMessage({ kind: 'guides', on: hub.guides }, '*'));
  });

  function post(msg) { frames.forEach(f => f.contentWindow && f.contentWindow.postMessage(msg, '*')); }

  document.querySelectorAll('[data-alert]').forEach(b => {
    b.onclick = () => {
      const type = b.dataset.alert;
      post(CL.send({ kind: 'alert', ev: { type, user: CL.pick(NAMES), gift: CL.pick(GIFTS), count: type === 'like' ? 50 : 3 } }));
    };
  });

  // Trạng thái kết nối TikFinity, hiện ngay dưới ô tick.
  // Chrome chặn trang https nối vào máy (127.0.0.1), nên TikFinity chỉ chạy với bản mở từ file trên máy.
  const ONLINE = location.protocol === 'https:';
  function showWs() {
    const el = $('#wsStatus');
    el.hidden = !cfg.ws;
    el.style.color = wsOk ? 'var(--p)' : '';
    el.textContent = L(wsOk ? 'wsOk' : ONLINE ? 'wsOnline' : 'wsMissing');
  }
  CL.onTiktokStatus(ok => { wsOk = ok; showWs(); });

  let sendTimer = null;
  function changed() {
    CL.tiktokConnect(cfg.ws);
    showWs();
    try { localStorage.setItem('cuteLive.cfg', JSON.stringify(cfg)); } catch (e) { /* bỏ qua */ }
    const t = CL.applyTheme(cfg);
    $('#color').value = cfg.color || t.p;
    $('#msgs').placeholder = CL.tickerList(Object.assign({}, cfg, { msgs: '' })).join('\n');
    document.querySelectorAll('.gtile').forEach(b => b.classList.toggle('on', b.dataset.game === cfg.game));
    if (charGame !== cfg.game) renderChars(); else markChars();
    document.querySelectorAll('#layout button').forEach(b => b.classList.toggle('on', b.dataset.v === cfg.layout));
    $('#cards').classList.toggle('h', cfg.layout === 'h');
    document.querySelectorAll('.sz').forEach(x => { x.textContent = cfg.layout === 'h' ? '1920×1080' : '1080×1920'; });
    $('#camsizeOut').textContent = cfg.camsize + 'px';
    clearTimeout(sendTimer);
    sendTimer = setTimeout(() => post(CL.send({ kind: 'cfg', cfg })), 120);
  }
  applyUI();
  changed();
</script>
</body>
