<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts</title>
<link rel="stylesheet" href="assets/cute.css">
<style>
  /* Băng thông báo trượt vào từ trái như killfeed, linh vật / quà trồi ra khỏi ô màu */
  .wrap { position: absolute; left: 48px; top: 800px; width: 940px; }
  body.h .wrap { top: 140px; left: 64px; width: 980px; }
  .alert { position: relative; display: flex; align-items: stretch; padding-top: 60px; animation: inA .55s var(--ease) both; }
  .alert.out { animation: outA .42s var(--ease) both; }
  @keyframes inA { from { transform: translateX(-115%); } to { transform: none; } }
  @keyframes outA { to { transform: translateX(-115%); } }
  .alert .ico { position: relative; flex: none; width: 210px; background: var(--p); }
  .alert .ico > span { position: absolute; left: 14px; right: 14px; bottom: 14px; top: 14px; animation: pop .5s cubic-bezier(.2, 1.7, .4, 1) .35s both; }
  .alert .ico .art-icon.cut { left: -6px; right: -6px; top: -60px; bottom: 0; filter: drop-shadow(0 14px 14px rgba(20, 8, 16, .3)); }
  .alert .ico .art-logo { clip-path: none; }
  @keyframes pop { from { transform: scale(.3) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .alert .plate { flex: 1; min-width: 0; padding: 26px 40px 28px 34px; }
  .alert .k { font: 600 30px/1 var(--fb); color: var(--p); }
  .alert .u { margin: 10px 0 8px; font: 800 96px/.95 var(--fd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert .t { font: 500 34px/1.3 var(--fb); color: var(--mute); }
</style>
</head>
<body>
<div class="viewport"><div class="stage">
  <div class="wrap" id="wrap"></div>
</div></div>
<script src="assets/cute.js"></script>
<script>
  // Mỗi loại alert lấy tiêu đề (…K) và câu (…T) theo ngôn ngữ đang chọn
  const KINDS = { follow: 'follow', gift: 'gift', like: 'like', share: 'share', sub: 'sub' };
  const NAMES = ['Mochi', 'Bánh Bao', 'Kem Dâu', 'Lily', 'Momo', '小雪', '糖糖', 'Su Kem', 'Kiko'];
  const GIFTS = ['Rose', 'Galaxy', 'Doughnut', 'Corgi', 'Heart Me'];
  const st = CL.init();
  const wrap = document.getElementById('wrap');
  const queue = [];
  let busy = false;

  function push(ev) {
    if (!KINDS[ev.type]) return;
    queue.push(ev);
    if (queue.length > 20) queue.shift();
    next();
  }
  function next() {
    if (busy || !queue.length) return;
    busy = true;
    show(queue.shift());
  }
  function show(ev) {
    const kind = KINDS[ev.type];
    const el = document.createElement('div');
    el.className = 'alert lift';
    el.innerHTML = `<div class="ico">${CL.artHTML(st.cfg, st.theme, 'icon')}</div>` +
      '<div class="plate"><div class="k"></div><div class="u"></div><div class="t"></div></div>';
    const c = st.cfg;
    el.querySelector('.k').textContent = CL.t(c, kind + 'K');
    el.querySelector('.u').textContent = ev.user || CL.t(c, 'someone');
    el.querySelector('.t').textContent = ev.text || CL.t(c, kind + 'T', { count: ev.count || (ev.type === 'like' ? 10 : 1), gift: ev.gift || CL.t(c, 'defaultGift') });
    wrap.appendChild(el);
    if (!(ev.demo && CL.q.mute)) chime(ev.type);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => { el.remove(); busy = false; next(); }, 420);
    }, ev.ms || 4200);
  }

  let ac = null;
  function chime(type) {
    if (st.cfg.sound === '0') return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const notes = type === 'gift' ? [784, 988, 1319] : [880, 1319];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.09;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + 0.55);
      });
    } catch (e) { /* trình duyệt chặn âm thanh */ }
  }

  // Nguồn sự kiện: bảng điều khiển, chế độ demo, TikFinity, hoặc gọi tay window.cuteAlert({...})
  CL.listen(msg => { if (msg.kind === 'alert' && msg.ev) push(msg.ev); });
  window.cuteAlert = push;
  if (CL.q.demo === '1') {
    const demo = () => {
      const type = CL.pick(['follow', 'gift', 'like', 'share', 'follow', 'sub']);
      push({ type, user: CL.pick(NAMES), gift: CL.pick(GIFTS), count: 1 + (Math.random() * (type === 'like' ? 99 : 9) | 0), demo: true });
    };
    setTimeout(demo, 600);
    setInterval(demo, 5600);
  }
  CL.onTiktok(push);
</script>
</body>
</html>
